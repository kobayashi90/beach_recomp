name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Initialize submodules
        run: git submodule update --init --recursive --force

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config squashfs-tools \
            libevdev-dev libudev-dev libgtk-3-dev libsystemd-dev \
            libbluetooth-dev libasound2-dev libpulse-dev libgl1-mesa-dev \
            libxrandr-dev libxi-dev

      - name: Build tools
        run: make tools JOBS=$(nproc)

      - name: Check compiler
        run: sh scripts/check-build.sh --no-fetch

      - name: Build AppImage
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '1.0.0' }}
        run: VERSION=${VERSION#v} bash packaging/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: BeachSpikers-Linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: warn

  windows:
    name: Windows (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Initialize submodules
        run: git submodule update --init --recursive --force

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure ModernGekko
        run: >
          cmake -S lib/ModernGekko -B lib/ModernGekko/build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          -DMODERNGEKKO_FRONTEND_NAME="Beach Spikers"
          -DMODERNGEKKO_LAUNCHER_OUTPUT_NAME="Beach Spikers"
          -DMODERNGEKKO_APP_ID="io.github.beachspikers.BeachSpikers"
          -DMODERNGEKKO_DEFAULT_WINDOW_TITLE="Beach Spikers"

      - name: Build ModernGekko
        run: cmake --build lib/ModernGekko/build --config Release --parallel

      - name: Configure DolRecomp
        run: cmake -S lib/DolRecomp -B lib/DolRecomp/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build DolRecomp
        run: cmake --build lib/DolRecomp/build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cd lib/ModernGekko/build
          zip -r ../../../dist/BeachSpikers-Windows.zip "Beach Spikers.exe" moderngekko-run.exe 2>/dev/null || true
          cd ../../..
          ls -la dist/ || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BeachSpikers-Windows
          path: dist/*
          if-no-files-found: warn

  macos:
    name: macOS (app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Initialize submodules
        run: git submodule update --init --recursive --force

      - name: Build tools
        run: make tools JOBS=$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          mkdir -p dist
          tar czf dist/BeachSpikers-macOS.tar.gz -C lib/ModernGekko/build "Beach Spikers" moderngekko-run 2>/dev/null || true
          ls -la dist/ || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BeachSpikers-macOS
          path: dist/*
          if-no-files-found: warn
