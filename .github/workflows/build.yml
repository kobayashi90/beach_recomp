name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      windows:
        description: "Also build the Windows package (llvm-mingw, experimental)"
        type: boolean
        default: false
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        run: git submodule update --init --recursive --force

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config squashfs-tools \
            desktop-file-utils \
            libevdev-dev libudev-dev libgtk-3-dev libsystemd-dev \
            libbluetooth-dev libasound2-dev libpulse-dev libgl1-mesa-dev \
            libxrandr-dev libxi-dev

      - name: Cache compiled objects
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-${{ hashFiles('.gitmodules', '**/CMakeLists.txt') }}
          variant: sccache
          max-size: 2G

      - name: Configure ModernGekko
        run: >
          cmake -S lib/ModernGekko -B lib/ModernGekko/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DMODERNGEKKO_FRONTEND_NAME="Beach Spikers"
          -DMODERNGEKKO_LAUNCHER_OUTPUT_NAME="Beach Spikers"
          -DMODERNGEKKO_APP_ID="io.github.beachspikers"
          -DMODERNGEKKO_DEFAULT_WINDOW_TITLE="Beach Spikers"
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build ModernGekko
        run: cmake --build lib/ModernGekko/build --parallel $(nproc)

      - name: Configure DolRecomp
        run: cmake -S lib/DolRecomp -B lib/DolRecomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build DolRecomp
        run: cmake --build lib/DolRecomp/build --parallel $(nproc)

      - name: Check compiler
        run: sh scripts/check-build.sh --no-fetch

      - name: Build AppImage
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '1.0.0' }}
        run: VERSION=${VERSION#v} bash packaging/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: BeachSpikers-Linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: warn

  # Windows is opt-in (workflow_dispatch -> windows=true) while it is being
  # rebuilt around ONE toolchain family.
  #
  # The old job mixed families: the runner/launcher came from MSVC, while the
  # module a player builds was compiled by the llvm-mingw clang in the package.
  # Two different C++ ABIs and two C runtimes in one process is exactly the kind
  # of thing that compiles and then fails at load time, and nothing in the
  # pipeline ever ran the result. This job now builds the runner, the launcher and
  # the shipped module compiler with the same llvm-mingw toolchain, so there is
  # one family end to end, and the artifact is meant to be checked with
  # tools/win-smoke.sh (wine + a module) before it is published.
  windows:
    name: Windows (zip, llvm-mingw)
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        run: git submodule update --init --recursive --force

      - name: Install llvm-mingw (one family for the build and for players)
        shell: pwsh
        run: |
          $tmp = $env:RUNNER_TEMP
          $zip = Join-Path $tmp "llvm-mingw.zip"
          if (-not (Test-Path $zip)) {
            Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-msvcrt-x86_64.zip" -OutFile $zip
          }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $tmp "llvm") -Force
          $src = Get-ChildItem (Join-Path $tmp "llvm") -Directory | Select-Object -First 1
          $tc = Join-Path $env:RUNNER_TEMP "toolchain"
          New-Item -ItemType Directory -Force -Path $tc | Out-Null
          Move-Item $src.FullName (Join-Path $tc "mingw")
          $mingw = Join-Path $tc "mingw/bin"
          "LLVM_MINGW=$((Join-Path $env:RUNNER_TEMP 'toolchain/mingw'))" >> $env:GITHUB_ENV
          $mingw >> $env:GITHUB_PATH

      - name: Configure ModernGekko
        shell: pwsh
        run: |
          # Forward slashes only: CMake writes the compiler paths into its own
          # .cmake files, and a Windows path there is read as an escape sequence
          # ("D:\a\_temp\..." -> "Invalid character escape '\a'").
          $mingw = (Join-Path $env:RUNNER_TEMP "toolchain/mingw").Replace('\', '/')
          # Static runtimes: a zip whose exes need libstdc++-6.dll and
          # libwinpthread-1.dll is a zip that fails on a clean machine.
          cmake -S lib/ModernGekko -B lib/ModernGekko/build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$mingw/bin/clang.exe" `
            -DCMAKE_CXX_COMPILER="$mingw/bin/clang++.exe" `
            -DCMAKE_RC_COMPILER="$mingw/bin/llvm-rc.exe" `
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" `
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libgcc -static-libstdc++" `
            -DBUILD_TESTING=OFF `
            -DMODERNGEKKO_FRONTEND_NAME="Beach Spikers" `
            -DMODERNGEKKO_LAUNCHER_OUTPUT_NAME="Beach Spikers" `
            -DMODERNGEKKO_APP_ID="io.github.beachspikers" `
            -DMODERNGEKKO_DEFAULT_WINDOW_TITLE="Beach Spikers"

      - name: Build ModernGekko
        run: cmake --build lib/ModernGekko/build --parallel

      - name: Configure DolRecomp
        shell: pwsh
        run: |
          $mingw = (Join-Path $env:RUNNER_TEMP "toolchain/mingw").Replace('\', '/')
          cmake -S lib/DolRecomp -B lib/DolRecomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$mingw/bin/clang.exe" -DCMAKE_CXX_COMPILER="$mingw/bin/clang++.exe"

      - name: Build DolRecomp
        run: cmake --build lib/DolRecomp/build --parallel

      - name: Package
        shell: pwsh
        run: |
          $pkg = "dist/BeachSpikers-Windows"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          $build = "lib/ModernGekko/build"
          $exes = @("Beach Spikers.exe", "moderngekko-run.exe", "moderngekko-port.exe", "dolrecomp.exe")
          foreach ($name in $exes) {
            $src = Join-Path $build $name
            if (-not (Test-Path $src)) { Write-Error "missing $src"; exit 1 }
            Copy-Item $src -Destination $pkg
          }
          # Whatever runtime DLLs the build still produces must travel with it.
          Get-ChildItem -Path $build -Filter *.dll -ErrorAction SilentlyContinue |
            Copy-Item -Destination $pkg
          foreach ($entry in @("GC", "Shaders", "Resources", "GameSettings")) {
            $src = Join-Path $build "Sys/$entry"
            if (Test-Path $src) { Copy-Item $src -Destination (Join-Path $pkg "Sys") -Recurse -Force }
          }
          $codehandler = Join-Path $build "Sys/codehandler.bin"
          if (Test-Path $codehandler) {
            New-Item -ItemType Directory -Force -Path (Join-Path $pkg "Sys") | Out-Null
            Copy-Item $codehandler -Destination (Join-Path $pkg "Sys")
          }
          $settings = Join-Path $pkg "Sys/GameSettings"
          if (Test-Path $settings) {
            Get-ChildItem -Path $settings -Filter *.ini | Where-Object { $_.Name -notlike "GBS*" } | Remove-Item -Force
          }

          # --- toolchain for the player -------------------------------------
          # The same llvm-mingw the package was built with. Identical family,
          # identical flags, so the module a player builds matches the runner
          # that loads it.
          $tc = Join-Path $pkg "Toolchain"
          New-Item -ItemType Directory -Force -Path (Join-Path $tc "bin") | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "toolchain/mingw") (Join-Path $tc "mingw") -Recurse -Force
          $mingwDir = Join-Path $tc "mingw"
          Remove-Item (Join-Path $mingwDir "include/c++") -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $mingwDir "lib/libear"),(Join-Path $mingwDir "lib/libscanbuild") -Recurse -Force -ErrorAction SilentlyContinue
          $dropBins = @("clangd*","clang-tidy*","clang-format*","clang-scan-deps*","clang-apply*",
                        "lldb*","liblldb*","libpython*","libomp*","scan-build*","scan-view*",
                        "aarch64-*","armv7-*","i686-*","arm64-*")
          foreach ($pattern in $dropBins) {
            Get-ChildItem (Join-Path $mingwDir "bin") -Filter $pattern -ErrorAction SilentlyContinue | Remove-Item -Force
          }

          $tmp = $env:RUNNER_TEMP
          $cmakeZip = Join-Path $tmp "cmake.zip"
          if (-not (Test-Path $cmakeZip)) {
            Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip" -OutFile $cmakeZip
          }
          Expand-Archive -Path $cmakeZip -DestinationPath (Join-Path $tmp "cmake") -Force
          Move-Item (Get-ChildItem (Join-Path $tmp "cmake") -Directory | Select-Object -First 1).FullName (Join-Path $tc "cmake")

          $ninjaZip = Join-Path $tmp "ninja.zip"
          if (-not (Test-Path $ninjaZip)) {
            Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip" -OutFile $ninjaZip
          }
          Expand-Archive -Path $ninjaZip -DestinationPath (Join-Path $tc "bin") -Force

          $share = Join-Path $pkg "share/dolphin"
          New-Item -ItemType Directory -Force -Path (Join-Path $share "Data/Sys/GameSettings") | Out-Null
          foreach ($d in @("module-template", "GXRuntime", "Source/Core/Core/PowerPC/StaticRecomp")) {
            $src = Join-Path "lib/ModernGekko/vendor/dolphin" $d
            if (Test-Path $src) {
              $dst = Join-Path $share $d
              New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
              Copy-Item $src -Destination $dst -Recurse -Force
            }
          }
          Get-ChildItem "lib/ModernGekko/vendor/dolphin/Data/Sys/GameSettings" -Filter "GBS*.ini" -ErrorAction SilentlyContinue |
            Copy-Item -Destination (Join-Path $share "Data/Sys/GameSettings")

          $pyZip = Join-Path $tmp "python-embed.zip"
          if (-not (Test-Path $pyZip)) {
            Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.13.9/python-3.13.9-embed-amd64.zip" -OutFile $pyZip
          }
          Expand-Archive -Path $pyZip -DestinationPath (Join-Path $tc "python") -Force

          Write-Host "=== package ==="
          Get-ChildItem -Path $pkg -Recurse -File | Measure-Object -Property Length -Sum |
            ForEach-Object { Write-Host "$($_.Count) files, $([math]::Round($_.Sum/1MB,1)) MB" }
          Compress-Archive -Path "$pkg/*" -DestinationPath "dist/BeachSpikers-Windows.zip" -Force
          Get-ChildItem -Path dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BeachSpikers-Windows
          path: dist/*
          if-no-files-found: warn

  macos:
    name: macOS (app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        run: git submodule update --init --recursive --force

      - name: Configure ModernGekko
        run: >
          cmake -S lib/ModernGekko -B lib/ModernGekko/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DMODERNGEKKO_FRONTEND_NAME="Beach Spikers"
          -DMODERNGEKKO_LAUNCHER_OUTPUT_NAME="Beach Spikers"
          -DMODERNGEKKO_APP_ID="io.github.beachspikers"
          -DMODERNGEKKO_DEFAULT_WINDOW_TITLE="Beach Spikers"

      - name: Build ModernGekko
        run: cmake --build lib/ModernGekko/build --parallel $(sysctl -n hw.ncpu)

      - name: Configure DolRecomp
        run: cmake -S lib/DolRecomp -B lib/DolRecomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build DolRecomp
        run: cmake --build lib/DolRecomp/build --parallel $(sysctl -n hw.ncpu)

      - name: Package
        run: |
          set -eu
          pkg=dist/BeachSpikers-macOS
          rm -rf "$pkg"
          mkdir -p "$pkg"
          cp "lib/ModernGekko/build/Beach Spikers" "$pkg/"
          cp lib/ModernGekko/build/moderngekko-run "$pkg/"
          for tool in moderngekko-port dolrecomp; do
            [ -x "lib/ModernGekko/build/$tool" ] && cp "lib/ModernGekko/build/$tool" "$pkg/" || true
          done
          for entry in GC Shaders Resources GameSettings; do
            [ -d "lib/ModernGekko/build/Sys/$entry" ] && cp -R "lib/ModernGekko/build/Sys/$entry" "$pkg/Sys/" || true
          done
          [ -f lib/ModernGekko/build/Sys/codehandler.bin ] && cp lib/ModernGekko/build/Sys/codehandler.bin "$pkg/Sys/" || true
          if [ -d "$pkg/Sys/GameSettings" ]; then
            find "$pkg/Sys/GameSettings" -name '*.ini' ! -name 'GBS*.ini' -delete
          fi
          share="$pkg/share/dolphin"
          mkdir -p "$share/Data/Sys/GameSettings"
          for d in module-template GXRuntime Source/Core/Core/PowerPC/StaticRecomp; do
            if [ -d "lib/ModernGekko/vendor/dolphin/$d" ]; then
              mkdir -p "$share/$(dirname "$d")"
              cp -R "lib/ModernGekko/vendor/dolphin/$d" "$share/$d"
            fi
          done
          cp lib/ModernGekko/vendor/dolphin/Data/Sys/GameSettings/GBS*.ini "$share/Data/Sys/GameSettings/" 2>/dev/null || true
          find "$pkg" -type f | wc -l
          tar czf dist/BeachSpikers-macOS.tar.gz -C dist BeachSpikers-macOS

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BeachSpikers-macOS
          path: dist/*
          if-no-files-found: warn
