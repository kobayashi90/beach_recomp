name: Build

# Builds the toolchain and packages it. The per-game module (g<disc>_recomp.so)
# needs an extracted disc image and is therefore NOT built here; the resulting
# package is a toolchain-only build whose launcher asks for a disc image on
# first run. To ship a build that already contains a module, run locally with
# your own dump: `make recompile GAME=beach && make appimage`.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Linux
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Initialize submodules
        run: git submodule update --init --recursive --force

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config squashfs-tools \
            libevdev-dev libudev-dev libgtk-3-dev libsystemd-dev \
            libbluetooth-dev libasound2-dev libpulse-dev libgl1-mesa-dev \
            libxrandr-dev libxi-dev

      - name: Configure ModernGekko
        run: cmake -S lib/ModernGekko -B lib/ModernGekko/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build ModernGekko
        run: cmake --build lib/ModernGekko/build --parallel

      - name: Configure DolRecomp
        run: cmake -S lib/DolRecomp -B lib/DolRecomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build DolRecomp
        run: cmake --build lib/DolRecomp/build --parallel

      - name: Check compiler
        run: sh scripts/check-build.sh --no-fetch

      - name: Build AppImage
        env:
          VERSION: ${{ github.ref_name }}
        run: VERSION=${VERSION#v} VERSION=${VERSION:-1.0.0} bash packaging/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: BeachSpikers-Linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: warn

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Initialize submodules
        run: git submodule update --init --recursive --force

      - name: Configure ModernGekko
        run: cmake -S lib/ModernGekko -B lib/ModernGekko/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build ModernGekko
        run: cmake --build lib/ModernGekko/build --config Release --parallel

      - name: Configure DolRecomp
        run: cmake -S lib/DolRecomp -B lib/DolRecomp/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build DolRecomp
        run: cmake --build lib/DolRecomp/build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          zip -r dist/BeachSpikers-Windows.zip lib/ModernGekko/build/*.exe lib/ModernGekko/build/ModernGekko*.dll 2>/dev/null || true
          ls -la dist/ || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BeachSpikers-Windows
          path: dist/*
          if-no-files-found: warn

  # ---------------------------------------------------------------- macOS
  macos:
    name: macOS (app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Initialize submodules
        run: git submodule update --init --recursive --force

      - name: Configure ModernGekko
        run: cmake -S lib/ModernGekko -B lib/ModernGekko/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build ModernGekko
        run: cmake --build lib/ModernGekko/build --parallel

      - name: Configure DolRecomp
        run: cmake -S lib/DolRecomp -B lib/DolRecomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build DolRecomp
        run: cmake --build lib/DolRecomp/build --parallel

      - name: Package
        run: |
          mkdir -p dist
          tar czf dist/BeachSpikers-macOS.tar.gz lib/ModernGekko/build/moderngekko-run 2>/dev/null || true
          ls -la dist/ || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BeachSpikers-macOS
          path: dist/*
          if-no-files-found: warn
