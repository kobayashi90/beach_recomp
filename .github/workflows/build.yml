name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        run: git submodule update --init --recursive --force

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config squashfs-tools \
            desktop-file-utils \
            libevdev-dev libudev-dev libgtk-3-dev libsystemd-dev \
            libbluetooth-dev libasound2-dev libpulse-dev libgl1-mesa-dev \
            libxrandr-dev libxi-dev

      - name: Cache compiled objects
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-${{ hashFiles('.gitmodules', '**/CMakeLists.txt') }}
          variant: sccache
          max-size: 2G

      - name: Configure ModernGekko
        run: >
          cmake -S lib/ModernGekko -B lib/ModernGekko/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DMODERNGEKKO_FRONTEND_NAME="Beach Spikers"
          -DMODERNGEKKO_LAUNCHER_OUTPUT_NAME="Beach Spikers"
          -DMODERNGEKKO_APP_ID="io.github.beachspikers"
          -DMODERNGEKKO_DEFAULT_WINDOW_TITLE="Beach Spikers"
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build ModernGekko
        run: cmake --build lib/ModernGekko/build --parallel $(nproc)

      - name: Configure DolRecomp
        run: cmake -S lib/DolRecomp -B lib/DolRecomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build DolRecomp
        run: cmake --build lib/DolRecomp/build --parallel $(nproc)

      - name: Check compiler
        run: sh scripts/check-build.sh --no-fetch

      - name: Build AppImage
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '1.0.0' }}
        run: VERSION=${VERSION#v} bash packaging/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: BeachSpikers-Linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: warn

  windows:
    name: Windows (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        run: git submodule update --init --recursive --force

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure ModernGekko
        run: >
          cmake -S lib/ModernGekko -B lib/ModernGekko/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          -DMODERNGEKKO_FRONTEND_NAME="Beach Spikers"
          -DMODERNGEKKO_LAUNCHER_OUTPUT_NAME="Beach Spikers"
          -DMODERNGEKKO_APP_ID="io.github.beachspikers"
          -DMODERNGEKKO_DEFAULT_WINDOW_TITLE="Beach Spikers"

      - name: Build ModernGekko
        run: cmake --build lib/ModernGekko/build --config Release --parallel

      - name: Configure DolRecomp
        run: cmake -S lib/DolRecomp -B lib/DolRecomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build DolRecomp
        run: cmake --build lib/DolRecomp/build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $build = "lib/ModernGekko/build"
          Write-Host "=== build dir exe files ==="
          Get-ChildItem -Path $build -Filter *.exe | Select-Object Name
          $files = @()
          foreach ($name in @("Beach Spikers.exe", "moderngekko-run.exe")) {
            $p = Join-Path $build $name
            if (Test-Path $p) { $files += $p }
          }
          if ($files.Count -gt 0) {
            Compress-Archive -Path $files -DestinationPath "dist/BeachSpikers-Windows.zip" -Force
            Write-Host "Created zip with $($files.Count) files"
          } else {
            Write-Error "No executables found to package"
            Get-ChildItem -Path $build | Select-Object Name
            exit 1
          }
          Write-Host "=== dist ==="
          Get-ChildItem -Path dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BeachSpikers-Windows
          path: dist/*
          if-no-files-found: warn

  macos:
    name: macOS (app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        run: git submodule update --init --recursive --force

      - name: Configure ModernGekko
        run: >
          cmake -S lib/ModernGekko -B lib/ModernGekko/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DMODERNGEKKO_FRONTEND_NAME="Beach Spikers"
          -DMODERNGEKKO_LAUNCHER_OUTPUT_NAME="Beach Spikers"
          -DMODERNGEKKO_APP_ID="io.github.beachspikers"
          -DMODERNGEKKO_DEFAULT_WINDOW_TITLE="Beach Spikers"

      - name: Build ModernGekko
        run: cmake --build lib/ModernGekko/build --parallel $(sysctl -n hw.ncpu)

      - name: Configure DolRecomp
        run: cmake -S lib/DolRecomp -B lib/DolRecomp/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build DolRecomp
        run: cmake --build lib/DolRecomp/build --parallel $(sysctl -n hw.ncpu)

      - name: Package
        run: |
          mkdir -p dist
          tar czf dist/BeachSpikers-macOS.tar.gz -C lib/ModernGekko/build "Beach Spikers" moderngekko-run 2>/dev/null || true
          ls -la dist/ || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BeachSpikers-macOS
          path: dist/*
          if-no-files-found: warn
